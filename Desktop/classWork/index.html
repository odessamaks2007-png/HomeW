<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Времена года и месяцы</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Времена года и месяцы</h1>

    <ul class="seasons-list">
        <!-- Зима -->
        <li class="season winter">
            <span class="season-title">Зима</span>
            <ul class="months-list">
                <li>Декабрь</li>
                <li>Январь</li>
                <li>Февраль</li>
            </ul>
        </li>

        <!-- Весна -->
        <li class="season spring">
            <span class="season-title">Весна</span>
            <ul class="months-list">
                <li>Март</li>
                <li>Апрель</li>
                <li>Май</li>
            </ul>
        </li>

        <!-- Лето -->
        <li class="season summer">
            <span class="season-title">Лето</span>
            <ul class="months-list">
                <li>Июнь</li>
                <li>Июль</li>
                <li>Август</li>
            </ul>
        </li>

        <!-- Осень -->
        <li class="season autumn">
            <span class="season-title">Осень</span>
            <ul class="months-list">
                <li>Сентябрь</li>
                <li>Октябрь</li>
                <li>Ноябрь</li>
            </ul>
        </li>
    </ul>

</body>
</html>
